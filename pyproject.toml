    "apscheduler>=3.10.4",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "rich>=13.8.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "motor>=3.6.0",
]
