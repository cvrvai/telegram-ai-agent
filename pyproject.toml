[project]
name = "telegram-ai-priority-bot"
version = "0.1.0"
description = "AI-powered Priority Filter and Periodic Digest Bot for Telegram"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "rich>=13.8.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "motor>=3.6.0",
    "google-api-python-client>=2.149.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
]

[tool.pytest.ini_options]
addopts = "--ignore=telegram-ai-priority-bot"
