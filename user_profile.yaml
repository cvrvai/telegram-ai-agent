# User Profile and Priority Customization Rules
# The AI Classifier uses these rules to contextualize incoming messages.

user_name: "Choonvai"

# Which business this assistant serves. Everything domain-specific lives here,
# not in code -- see examples/user_profile.hotel.yaml and
# examples/user_profile.farming.yaml for ready-made profiles you can copy over.
business:
  name: "Choonvai's workspace"
  description: >-
    a small operation coordinating daily work over Telegram across projects,
    clients, and suppliers
  impact_label: "Critical impact"
  impact_definition: >-
    the people or commitments this operation exists to serve are directly
    affected -- a client, a delivery, or a deadline that has been promised
  units: []

high_priority_rules:
  - "University lecturer, professor, or teaching assistant messages"
  - "Assignment, exam, course registration, or deadline changes"
  - "CloudKH project decisions, blockers, code reviews, design sign-offs, and architecture proposals"
  - "Work, client, freelance, or commercial contract requests"
  - "Payment, banking, invoice, billing, or supplier critical issues"
  - "Messages explicitly asking for my immediate decision, approval, or answer"
  - "Emergency, server downtime, security alerts, or production bugs"

medium_priority_rules:
  - "General project progress updates without immediate blocker"
  - "Meeting notes, schedule summaries, or agendas"
  - "Useful technical announcements, tools, or library updates"
  - "Interesting group discussions relevant to active projects"

low_priority_rules:
  - "Casual chatting, greetings (hi, gm, gn), jokes, banter, sports match discussions"
  - "Memes, stickers, GIF reactions, emoji-only responses"
  - "Repeated questions already answered"
  - "Spam, automated broadcast ads, promotional newsletters"

# Known VIP senders (usernames or names that should get higher weight)
vip_senders:
  - "boss"
  - "lecturer"
  - "professor"
  - "client"
  - "team_lead"

# Key project keywords
important_projects:
  - "CloudKH"
  - "University"
  - "Thesis"
  - "Work"

# Chats or channels to completely ignore or mute (optional)
ignore_chats: []
